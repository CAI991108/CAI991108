name: Contribution snake

on:
  schedule:
    # 00:15 UTC = 08:15 Asia/Hong_Kong, after the contribution day rolls over
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate the snake from the contribution grid
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Catppuccin Mocha ramp, transparent background so the one SVG reads
          # on both GitHub themes (the grid gets brighter as contributions rise).
          outputs: |
            dist/snake.svg?color_snake=#89b4fa&color_dots=#313244,#45475a,#585b70,#7f849c,#cdd6f4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
