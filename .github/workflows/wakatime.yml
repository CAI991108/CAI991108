name: Weekly coding stats

on:
  schedule:
    # Sundays 18:30 UTC = Monday 02:30 Asia/Hong_Kong
    - cron: '30 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Refresh the weekly coding stats block
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@4db28e08bfd8bac570125799fe1cfdcb23a8c871 # master 2026-08-04
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # The weekly breakdown only; the two summary badges were removed by hand.
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_COMMIT: "True"
          SHOW_LANGUAGE: "False"
          SHOW_EDITORS: "True"
          SHOW_OS: "True"
          SHOW_PROJECTS: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_TIMEZONE: "True"
          SHOW_UPDATED_DATE: "True"
          UPDATED_DATE_FORMAT: "%Y-%m-%d"
          BADGE_STYLE: "flat-square"
          # Dropped: duplicates the Signals cards, or is noise inside a <details>
          SHOW_SHORT_INFO: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_LOC_CHART: "False"
          SHOW_AI_CODING: "False"
          COMMIT_MESSAGE: "chore(stats): weekly coding stats"
